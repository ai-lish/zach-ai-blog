<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" role="img" aria-labelledby="title desc">
  <title id="title">模型與操作軟件的四組配對</title>
  <desc id="desc">GPT 配 Codex、Claude 配 Claude Code、MiniMax 配 Hermes 或 OpenClaw、Gemini 配 Antigravity。</desc>
  <style>
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .card { fill: #f4f7f5; stroke: #cbd8d4; stroke-width: 2; }
    .model { fill: #087f73; font-size: 31px; font-weight: 700; }
    .arrow { fill: #667275; font-size: 37px; font-weight: 600; }
    .software { fill: #20282b; font-size: 30px; font-weight: 700; }
  </style>
  <g>
    <rect class="card" x="16" y="18" width="728" height="138" rx="20" />
    <text class="model" x="58" y="102">GPT</text>
    <text class="arrow" x="288" y="103">↔</text>
    <text class="software" x="390" y="102">Codex</text>
  </g>
  <g>
    <rect class="card" x="16" y="178" width="728" height="138" rx="20" />
    <text class="model" x="58" y="262">Claude</text>
    <text class="arrow" x="288" y="263">↔</text>
    <text class="software" x="390" y="262">Claude Code</text>
  </g>
  <g>
    <rect class="card" x="16" y="338" width="728" height="138" rx="20" />
    <text class="model" x="58" y="422">MiniMax</text>
    <text class="arrow" x="288" y="423">↔</text>
    <text class="software" x="390" y="422">Hermes／OpenClaw</text>
  </g>
  <g>
    <rect class="card" x="16" y="498" width="728" height="138" rx="20" />
    <text class="model" x="58" y="582">Gemini</text>
    <text class="arrow" x="288" y="583">↔</text>
    <text class="software" x="390" y="582">Antigravity</text>
  </g>
</svg>
