<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0EFEC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8E4DF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E4DF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4CFC9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="320" fill="url(#grad1)" rx="8"/>
  <rect x="20" y="20" width="360" height="280" rx="6" fill="url(#grad2)" opacity="0.5"/>
  <!-- Decorative math symbols -->
  <text x="40" y="60" font-size="24" fill="#C4BFB8" font-family="serif">∑</text>
  <text x="340" y="55" font-size="22" fill="#C4BFB8" font-family="serif">π</text>
  <text x="50" y="270" font-size="20" fill="#C4BFB8" font-family="serif">x²</text>
  <text x="320" y="275" font-size="20" fill="#C4BFB8" font-family="serif">√</text>
  <text x="175" y="45" font-size="16" fill="#D4CFC9" font-family="sans-serif">AI</text>
  <!-- Simple icon in center -->
  <circle cx="200" cy="160" r="40" fill="#E8E4DF" opacity="0.6"/>
  <text x="200" y="170" font-size="32" fill="#A8A29E" text-anchor="middle" font-family="sans-serif">📄</text>
</svg>
